name: Windows code-server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1
        
      - name: Install Visual Studio Code
        shell: pwsh
        run: choco install vscode -y

      - name: Install and Configure code-server
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Install code-server via Chocolatey (most reliable on Windows)
          choco install code-server -y
          
          # Refresh environment to get code-server in PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # Create code-server config directory
          $configDir = "$env:USERPROFILE\.config\code-server"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          
          # Set password
          $password = $env:RDP_PASSWORD
          if (-not $password) { $password = "codeserver" }
          
          # Create config file
          $configContent = "bind-addr: 0.0.0.0:8080`nauth: password`npassword: $password`ncert: false"
          $configContent | Out-File -FilePath "$configDir\config.yaml" -Encoding utf8 -NoNewline
          
          # Install VS Code extensions
          code-server --install-extension ms-python.python
          code-server --install-extension dbaeumer.vscode-eslint
          code-server --install-extension esbenp.prettier-vscode
          code-server --install-extension bradlc.vscode-tailwindcss
          
          # Use official VS Code Marketplace instead of Open VSX (enables GitHub Copilot)
          $env:EXTENSIONS_GALLERY = '{"serviceUrl": "https://marketplace.visualstudio.com/_apis/public/gallery", "cacheUrl": "https://vscode.blob.core.windows.net/gallery/index", "itemUrl": "https://marketplace.visualstudio.com/items"}'
          
          # Install GitHub Copilot (now available via VS Code Marketplace)
          code-server --install-extension GitHub.copilot
          code-server --install-extension GitHub.copilot-chat
          
          # Install Continue.dev as additional open-source AI coding assistant
          code-server --install-extension continue.continue

      - name: Start code-server
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # Use official VS Code Marketplace instead of Open VSX (enables GitHub Copilot)
          $env:EXTENSIONS_GALLERY = '{"serviceUrl": "https://marketplace.visualstudio.com/_apis/public/gallery", "cacheUrl": "https://vscode.blob.core.windows.net/gallery/index", "itemUrl": "https://marketplace.visualstudio.com/items"}'
          
          # Set password for display
          $password = $env:RDP_PASSWORD
          if (-not $password) { $password = "codeserver" }
          
          # Start code-server in background with EXTENSIONS_GALLERY env var
          Start-Job -ScriptBlock {
            $env:EXTENSIONS_GALLERY = '{"serviceUrl": "https://marketplace.visualstudio.com/_apis/public/gallery", "cacheUrl": "https://vscode.blob.core.windows.net/gallery/index", "itemUrl": "https://marketplace.visualstudio.com/items"}'
            code-server --bind-addr 0.0.0.0:8080
          }
          Start-Sleep -Seconds 5
          
          # Display connection info
          Write-Host "`n=== code-server ACCESS ==="
          Write-Host "URL: http://$($env:TAILSCALE_IP):8080"
          Write-Host "Password: $password"
          Write-Host "=======================`n"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
