name: Windows code-server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1
        
      - name: Install Visual Studio Code
        shell: pwsh
        run: choco install vscode -y

      - name: Configure VS Code Extensions and Settings
        shell: pwsh
        run: |
          # Copy VS Code config from repository
          $vscodeDir = "$env:USERPROFILE\.vscode"
          New-Item -ItemType Directory -Force -Path $vscodeDir | Out-Null
          
          # Copy settings and extensions from repo
          if (Test-Path ".vscode\settings.json") {
            Copy-Item ".vscode\settings.json" "$vscodeDir\settings.json" -Force
            Write-Host "Copied settings.json"
          }
          
          if (Test-Path ".vscode\extensions.json") {
            Copy-Item ".vscode\extensions.json" "$vscodeDir\extensions.json" -Force
            Write-Host "Copied extensions.json"
          }
          
          # Install extensions from list
          $extensions = @(
            "GitHub.copilot",
            "GitHub.copilot-chat", 
            "ms-python.python",
            "dbaeumer.vscode-eslint",
            "esbenp.prettier-vscode",
            "bradlc.vscode-tailwindcss",
            "continue.continue"
          )

          foreach ($ext in $extensions) {
            Write-Host "Installing extension: $ext"
            & "${env:ProgramFiles}\Microsoft VS Code\bin\code.cmd" --install-extension $ext
          }
          
          Write-Host "VS Code configuration completed!"
          Write-Host "Settings Sync enabled - sign in to restore your configuration"

      - name: Start VS Code Remote Tunnel (Web IDE)
        shell: pwsh
        run: |
          $codeCmd = "${env:ProgramFiles}\Microsoft VS Code\bin\code.cmd"
          if (-not (Test-Path $codeCmd)) {
            throw "VS Code CLI not found at $codeCmd"
          }

          $tunnelName = "gh-${env:GITHUB_RUN_ID}"
          $tunnelLog = "$env:TEMP\vscode-tunnel.log"
          if (Test-Path $tunnelLog) { Remove-Item -Force $tunnelLog }

          Write-Host "==================== VS CODE TUNNEL ===================="
          Write-Host "Tunnel Name: $tunnelName"
          Write-Host "Web IDE URL: https://vscode.dev/tunnel/$tunnelName"
          Write-Host ""
          Write-Host "If this is the first time for this runner, the tunnel will print a device login code."
          Write-Host "1) Open: https://github.com/login/device"
          Write-Host "2) Enter the code shown below"
          Write-Host "3) IMPORTANT: Use the SAME GitHub account when signing into vscode.dev"
          Write-Host "========================================================"

          # Start tunnel in background and capture output to a log file so it shows in runner logs later.
          Start-Process -NoNewWindow -FilePath "pwsh" -ArgumentList @(
            "-NoProfile",
            "-Command",
            "& '$codeCmd' tunnel --accept-server-license-terms --name '$tunnelName' *>&1 | Tee-Object -FilePath '$tunnelLog'"
          )

          Start-Sleep -Seconds 5
          if (Test-Path $tunnelLog) {
            Write-Host "---- tunnel log (last 80 lines) ----"
            Get-Content -Path $tunnelLog -Tail 80
            Write-Host "------------------------------------"
          } else {
            Write-Host "Tunnel log not found yet: $tunnelLog"
          }

      - name: Maintain Connection
        shell: pwsh
        run: |
          $tunnelName = "gh-${env:GITHUB_RUN_ID}"
          $tunnelLog = "$env:TEMP\vscode-tunnel.log"
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          Write-Host "=== WEB IDE (VS Code Tunnel) ==="
          Write-Host "URL: https://vscode.dev/tunnel/$tunnelName"
          Write-Host "If vscode.dev says tunnel not found, re-check device login + account match."
          Write-Host "==========================="
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            if (Test-Path $tunnelLog) {
              Write-Host "---- tunnel log (last 30 lines) ----"
              Get-Content -Path $tunnelLog -Tail 30
              Write-Host "------------------------------------"
            } else {
              Write-Host "Tunnel log not found yet: $tunnelLog"
            }
            Start-Sleep -Seconds 300
          }
