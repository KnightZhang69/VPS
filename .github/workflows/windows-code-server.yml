name: Windows code-server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1
        
      - name: Install Visual Studio Code
        shell: pwsh
        run: choco install vscode -y

      - name: Configure VS Code Extensions and Settings
        shell: pwsh
        run: |
          # Copy VS Code config from repository
          $vscodeDir = "$env:USERPROFILE\.vscode"
          New-Item -ItemType Directory -Force -Path $vscodeDir | Out-Null
          
          # Copy settings and extensions from repo
          if (Test-Path ".vscode\settings.json") {
            Copy-Item ".vscode\settings.json" "$vscodeDir\settings.json" -Force
            Write-Host "Copied settings.json"
          }
          
          if (Test-Path ".vscode\extensions.json") {
            Copy-Item ".vscode\extensions.json" "$vscodeDir\extensions.json" -Force
            Write-Host "Copied extensions.json"
          }
          
          # Install extensions from list
          $extensions = @(
            "GitHub.copilot",
            "GitHub.copilot-chat", 
            "ms-python.python",
            "dbaeumer.vscode-eslint",
            "esbenp.prettier-vscode",
            "bradlc.vscode-tailwindcss",
            "continue.continue"
          )

          foreach ($ext in $extensions) {
            Write-Host "Installing extension: $ext"
            & "${env:ProgramFiles}\Microsoft VS Code\bin\code.cmd" --install-extension $ext
          }
          
          Write-Host "VS Code configuration completed!"
          Write-Host "Settings Sync enabled - sign in to restore your configuration"

      - name: Start VS Code Remote Tunnel (Web IDE)
        shell: pwsh
        run: |
          $codeCmd = "${env:ProgramFiles}\Microsoft VS Code\bin\code.cmd"
          if (-not (Test-Path $codeCmd)) {
            throw "VS Code CLI not found at $codeCmd"
          }

          $tunnelName = "gh-${env:GITHUB_RUN_ID}"
          Write-Host "Starting VS Code Remote Tunnel: $tunnelName"
          Write-Host "If prompted, complete device login in the workflow logs to activate the tunnel."

          Start-Process -NoNewWindow -FilePath $codeCmd -ArgumentList @(
            "tunnel",
            "--accept-server-license-terms",
            "--name",
            $tunnelName
          )

          Write-Host "Web IDE URL (after auth): https://vscode.dev/tunnel/$tunnelName"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
